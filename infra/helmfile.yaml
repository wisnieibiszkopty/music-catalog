repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
    
releases:
  - name: redis
    namespace: music-catalog
    chart: bitnami/redis
    version: 25.5.3
    values:
      - auth:
          password: "password"
        master:
          persistence:
            size: 1Gi
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
        replica:
          replicaCount: 0
          
          
  - name: rabbitmq
    namespace: music-catalog
    chart: bitnami/rabbitmq
    version: 16.0.14
    values:
      - auth:
          username: "user"
          password: "password"
        persistence:
          size: 1Gi
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
        replicaCount: 1
        livenessProbe:
          enabled: true
        readinessProbe:
          enabled: true