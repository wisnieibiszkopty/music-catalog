apiVersion: apps/v1
kind: Deployment
metadata:
  name: artist-service
  namespace: music-catalog
  labels:
    app: artist-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artist-service
  template:
    metadata:
      labels:
        app: artist-service
    spec:
      initContainers:
        - name: flyway-migrate
          image: wisnieibiszkopty/music-catalog-artist-migrations:0.1.0
          imagePullPolicy: Always
          command:
            - flyway
            - -connectRetries=60
            - migrate
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: artist-service-secret
                  key: url
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: artist-service-secret
                  key: user
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artist-service-secret
                  key: password
      containers:
        - name: artist-service
          image: wisnieibiszkopty/music-catalog-artist-service:0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: artist-service-secret
                  key: connection-string
            - name: ConnectionStrings__RabbitMq
              valueFrom:
                secretKeyRef:
                  name: artist-service-secret
                  key: rabbitmq-url
            - name: Keycloak__InternalUrl
              valueFrom:
                configMapKeyRef:
                  name: artist-service-config
                  key: Keycloak__InternalUrl
            - name: Keycloak__Realm
              valueFrom:
                configMapKeyRef:
                  name: artist-service-config
                  key: Keycloak__Realm
            - name: Otlp__Endpoint
              valueFrom:
                configMapKeyRef:
                  name: artist-service-config
                  key: Otlp__Endpoint
            - name: NPGSQL_GSSAPI_LIBRARIES
              valueFrom:
                configMapKeyRef:
                  name: artist-service-config
                  key: NPGSQL_GSSAPI_LIBRARIES
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
      restartPolicy: Always