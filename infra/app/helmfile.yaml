repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: groundhog2k
    url: https://groundhog2k.github.io/helm-charts/
  - name: jetstack
    url: https://charts.jetstack.io

    
releases:
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.20.2
    values:
      - crds:
          enabled: true
        startupapicheck:
          enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        cainjector:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi


  - name: redis
    namespace: music-catalog
    chart: bitnami/redis
    version: 25.5.3
    values:
      - helmfile-secrets/redis.yaml
      - master:
          persistence:
            storageClass: local-path
            size: 1Gi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
        replica:
          replicaCount: 0


  - name: rabbitmq
    namespace: music-catalog
    chart: groundhog2k/rabbitmq
    version: 2.3.0
    values:
      - helmfile-secrets/rabbitmq.yaml
      - podSecurityContext:
          fsGroup: 999
        authentication:
          user:
            value: "user"
        env:
          - name: RABBITMQ_LOGS
            value: "-"
        storage:
          storageClassName: local-path
          requestedSize: 1Gi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi