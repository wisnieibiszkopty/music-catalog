repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: groundhog2k
    url: https://groundhog2k.github.io/helm-charts/
  - name: jetstack
    url: https://charts.jetstack.io

    
releases:
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.20.2
    values:
      - crds:
          enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        cainjector:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi


  - name: redis
    namespace: music-catalog
    chart: bitnami/redis
    version: 25.5.3
    values:
      - auth:
          password: "password"
        master:
          persistence:
            size: 1Gi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
        replica:
          replicaCount: 0
          
          
  - name: rabbitmq
    namespace: music-catalog
    chart: groundhog2k/rabbitmq
    version: 2.3.0
    values:
      - authentication:
          user:
            value: "user"
          password:
            value: "password"
          erlangCookie:
            value: "secreterlangcookie"
        env:
          - name: RABBITMQ_LOGS
            value: "-"
        storage:
          requestedSize: 1Gi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi