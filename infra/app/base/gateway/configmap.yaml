apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: music-catalog
data:
  Keycloak__InternalUrl: "http://keycloak.music-catalog.svc.cluster.local/auth"
  Keycloak__ExternalUrl: "http://music-catalog.local:8080/auth"
  Keycloak__Realm: "music-catalog"
  Keycloak__Audience: "api-client"
  AllowedOrigins__0: "http://music-catalog.local:8080"