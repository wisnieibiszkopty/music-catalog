apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: artist-db
  namespace: music-catalog
spec:
  serviceName: artist-db
  replicas: 1
  selector:
    matchLabels:
      app: artist-db
  template:
    metadata:
      labels:
        app: artist-db
    spec:
      containers:
        - name: artist-db
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: artist-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artist-secret
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: artist-secret
                  key: database
          resources:
            limits:
              cpu: "500m"
              memory: "100Mi"
            requests:
              cpu: "100m"
              memory: "50Mi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(ARTISTS_DB)
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(ARTISTS_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: artist-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: artist-storage
          persistentVolumeClaim:
            claimName: artist-data