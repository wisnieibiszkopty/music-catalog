apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-service
  namespace: music-catalog
  labels:
    app: scraper-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scraper-service
  template:
    metadata:
      labels:
        app: scraper-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: scraper-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: scraper-service
          image: wisnieibiszkopty/music-catalog-scraper-service:0.1.0
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          envFrom:
            - configMapRef:
                name: shared-config
          env:
            - name: ConnectionStrings__RabbitMq
              valueFrom:
                secretKeyRef:
                  name: scraper-service-secret
                  key: rabbitmq-url
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: scraper-service-secret
                  key: redis-url
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: scraper-service-secret
                  key: spotify-client-id
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scraper-service-secret
                  key: spotify-client-secret
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
