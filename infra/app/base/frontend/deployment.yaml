apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: music-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: wisnieibiszkopty/music-catalog-web-app:0.4.0
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "200m"
              memory: "80Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3