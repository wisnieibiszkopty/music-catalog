apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: music-catalog
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: wisnieibiszkopty/music-catalog-notification-service:0.1.0
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
          env:
            - name: ConnectionStrings__RabbitMq
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: rabbitmq-url
            - name: Keycloak__InternalUrl
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: Keycloak__InternalUrl
            - name: Keycloak__Realm
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: Keycloak__Realm