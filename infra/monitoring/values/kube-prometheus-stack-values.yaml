alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    scrapeInterval: "30s"
    scrapeTimeout: "10s"
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    retention: 15d
    retentionSize: "2GB"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: local-path
          resources:
            requests:
              storage: 5Gi

grafana:
  enabled: true
  image:
    tag: "11.4.0"
  adminPassword: "admin123"
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      healthCheckPort: ""
    datasources:
      enabled: true
      searchNamespace: ALL
      healthCheckPort: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      serve_from_sub_path: true
    security:
      allow_embedding: true
      cookie_samesite: lax
    auth.anonymous:
      enabled: false
    plugins:
      enable_alpha: false
  plugins: []
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
        derivedFields:
          - name: TraceID
            matcherRegex: '"TraceId":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi