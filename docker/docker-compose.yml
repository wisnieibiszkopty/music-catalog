services:
  api-gateway:
    build:
      context: ..
      dockerfile: src/gateway/ApiGateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - auth-service
      - artist-service
  
  auth-db:
    image: postgres:18-alpine
    container_name: auth-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=auth-db
    volumes:
      - auth-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d artist_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  auth-service:
    build:
      context: ..
      dockerfile: src/services/Auth.Service/Dockerfile
    container_name: auth-api
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=auth-db;Port=5432;Database=auth_db;Username=admin;Password=123
      ASPNETCORE_URLS: http://+:8080
  
  artist-db:
    image: postgres:18-alpine
    container_name: artist_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=artist_db
    volumes:
      - artist-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d auth-db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  artist-db-migrator:
    image: flyway/flyway:latest-alpine
    depends_on: 
      artist-db:
        condition: service_healthy
    volumes:
      - ../src/services/Artists.Service/migrations:/flyway/sql
    command: -url=jdbc:postgresql://artist-db:5432/artist_db -user=admin -password=123 -connectRetries=60 migrate

  artist-service:
    build:
      context: ..
      dockerfile: src/services/Artists.Service/Dockerfile
    depends_on:
      artist-db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=artist-db;Port=5432;Database=artist_db;Username=admin;Password=123
      ASPNETCORE_URLS: http://+:8080
  
volumes:
  auth-data:
  artist-data: